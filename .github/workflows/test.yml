name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.8 is the floor the code claims to support; test the claim rather than
        # assuming it. 3.14 is the line the Dockerfile ships, so the version that runs on
        # the server is a version that is tested. Bump the two together or the pairing
        # rots. No pip install step exists on purpose -- stdlib only.
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile every module
        run: python -m compileall -q recipegraph

  # THE JAVA PORT'S PURE CORE -- the graph reader, the solver and the cost model, a little over
  # 40% of the Java suite. The reason this job exists at all is that before it NOT ONE Java test
  # ran on a pull request: the port was checked only when a human remembered to run
  # `tools/check.sh`, and this repository has reddened master twice from a distracted merge. The
  # run prints its own counts, so no number here has to be maintained to stay true.
  #
  # WHAT IT DOES NOT COVER IS IN `tools/ci-java.sh`'s header, in full, including the one skip it
  # allows and why no synthetic oracle can retire it. Read that before trusting this tick: the
  # golden plan gate needs a 121 MB graph that is not in git, so this job is a FLOOR and not a
  # substitute for `tools/check.sh` before a merge. The script fails on any OTHER skip, which is
  # what stops that honest gap from quietly widening.
  java-core:
    runs-on: ubuntu-latest
    steps:
      # THE REPOSITORY ROOT, NOT `mod/`. `PlanFixtureTest` and `PlanNodeRoundTripTest` read
      # `tests/fixtures/` from outside `mod/`, as `DigestFixtureTest` does, and a `mod/`-only
      # context compiles fine and then fails with a bare IOException that names nothing. That
      # has cost a full cold build once already; the default checkout is right, so do NOT add a
      # `sparse-checkout` here.
      - uses: actions/checkout@v7
      # JDK 25, NOT 21. This job does not go through Gradle, so RetroFuturaGradle is not what
      # demands it today -- RFG 2.0.2 ships class file version 69 and dies on 21 with an
      # `UnsupportedClassVersionError` naming the PLUGIN rather than any mod source, which reads
      # as a broken build script. 25 is what the container in `tools/check.sh` runs, and keeping
      # the two the same means a failure here reproduces there. The mod's own target is still
      # Java 8, enforced by `javac --release 8` inside the script.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: The pure-Java core of the port
        run: tools/ci-java.sh
