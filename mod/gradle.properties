# Pinned to the versions MeatballCraft 0.18.4 actually runs, verified against the
# instance on disk (HadEnoughItems_1.12.2-4.28.1.jar reports modid `jei` v4.28.1).
# jei_version is the API to compile against; HEI implements the same public API.
mod_version=0.1.0
minecraft_version=1.12.2
forge_version=14.23.5.2860
mappings_version=stable_39
jei_version=4.28.1

# Gradle 4.x needs this to avoid the daemon picking a newer JVM.
org.gradle.jvmargs=-Xmx2G
