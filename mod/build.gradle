// 1.12.2 Forge mod build, on RetroFuturaGradle rather than ForgeGradle 2.3.
//
// WHY NOT ForgeGradle 2.3 (the "classic" 1.12.2 plugin): it resolves Forge from
// `forge-<ver>-userdev.jar`, and Forge's maven no longer publishes that artifact for
// 1.12.2 -- only `userdev3`, which is the FG3+ layout (config.json + joined.lzma +
// patches) that FG2 cannot read. Verified: userdev 404s, userdev3 200s, and renaming
// one to the other fails because FG2 looks for a dev.json that isn't in there.
// DO NOT "simplify" this back to ForgeGradle 2.3; it cannot resolve Forge any more.
//
// RFG 2.0.2 is what CleanroomMC's own 1.12.2 template uses -- and Cleanroom is the
// loader this pack runs on, so it is the best-supported path available.
//
// Build it with:  ./gradlew build -Phei_jar=/path/to/HadEnoughItems_1.12.2-4.28.1.jar

plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = 'io.github.jacoblasky'
version = project.mod_version
base { archivesName.set('mc-recipe-dump') }

java {
    toolchain {
        // Minecraft 1.12.2 must be compiled by Java 8. Gradle itself may run on a
        // modern JDK; the foojay resolver in settings.gradle downloads this toolchain
        // if the machine lacks it. Azul covers the most platforms for Java 8.
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
}

minecraft {
    mcVersion.set(project.minecraft_version)
    mcpMappingChannel.set(project.mapping_channel)
    mcpMappingVersion.set(project.mapping_version)
}

// Compile against the HadEnoughItems jar from the pack itself, not a maven JEI
// artifact. Two reasons this is not laziness:
//   1. HEI 4.28.1 is published by DimensionalDevelopment, NOT under mezz.jei on
//      progwml6, which only carries JEI up to 4.16.x for 1.12.2. The coordinate
//      `mezz.jei:jei_1.12.2:4.28.1` does not exist and will not resolve.
//   2. A 1.12.2 mod jar already carries MCP-named references, and this mod is compiled
//      against MCP names too, so a plain file dependency links correctly with no
//      deobfuscation step.
def heiJar = project.findProperty('hei_jar')

dependencies {
    if (heiJar && file(heiJar).exists()) {
        compileOnly files(heiJar)
    }
}

// Fail with an actionable message rather than 40 "package mezz.jei.api does not exist"
// errors, which is what a missing or wrong hei_jar actually looks like.
tasks.register('checkHeiJar') {
    doFirst {
        if (!heiJar) {
            throw new GradleException(
                'Set -Phei_jar=/path/to/HadEnoughItems_1.12.2-4.28.1.jar ' +
                '(or add hei_jar= to gradle.properties)')
        }
        if (!file(heiJar).exists()) {
            throw new GradleException("hei_jar does not exist: ${heiJar}")
        }
    }
}
tasks.named('compileJava') { dependsOn 'checkHeiJar' }

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.minecraft_version
    }
}


