import org.gradle.api.tasks.PathSensitivity

// 1.12.2 Forge mod build, on RetroFuturaGradle rather than ForgeGradle 2.3.
//
// WHY NOT ForgeGradle 2.3 (the "classic" 1.12.2 plugin): it resolves Forge from
// `forge-<ver>-userdev.jar`, and Forge's maven no longer publishes that artifact for
// 1.12.2 -- only `userdev3`, which is the FG3+ layout (config.json + joined.lzma +
// patches) that FG2 cannot read. Verified: userdev 404s, userdev3 200s, and renaming
// one to the other fails because FG2 looks for a dev.json that isn't in there.
// DO NOT "simplify" this back to ForgeGradle 2.3; it cannot resolve Forge any more.
//
// RFG 2.0.2 is what CleanroomMC's own 1.12.2 template uses -- and Cleanroom is the
// loader this pack runs on, so it is the best-supported path available.
//
// Build it with:  ./gradlew build -Ppack_mods=/path/to/an/instance/mods
// See `packJars` below for what it takes from there and why not from maven.

plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = 'io.github.jacoblasky'
version = project.mod_version
base { archivesName.set('mc-recipe-dump') }

java {
    toolchain {
        // Minecraft 1.12.2 must be compiled by Java 8. Gradle itself may run on a
        // modern JDK; the foojay resolver in settings.gradle downloads this toolchain
        // if the machine lacks it. Azul covers the most platforms for Java 8.
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
}

minecraft {
    mcVersion.set(project.minecraft_version)
    mcpMappingChannel.set(project.mapping_channel)
    mcpMappingVersion.set(project.mapping_version)
}

// Compile against jars FROM THE PACK, not against maven artifacts. Two reasons this is
// not laziness, and they apply to every entry in `packJars` below:
//   1. These versions are not on maven. HEI 4.28.1 is published by DimensionalDevelopment,
//      NOT under mezz.jei on progwml6, which only carries JEI up to 4.16.x for 1.12.2 --
//      `mezz.jei:jei_1.12.2:4.28.1` does not exist and will not resolve. ModularUI and
//      AE2-UEL have the same problem: the pack runs specific builds, and the pack is the
//      only place they are guaranteed to exist.
//   2. A plain file dependency is enough to COMPILE against, because compilation only reads
//      the other mod's own signatures, which reobfuscation does not touch.
//
// COMPILING AGAINST A PACK JAR IS NOT THE SAME AS RUNNING ONE. A pack jar is a production
// build, so the Minecraft calls INSIDE it are SRG (`ResourceLocation.func_110623_a`), while
// this mod and RFG's test classpath are MCP (`getResourcePath`). In game everything is SRG
// and FML remaps mod jars inside a dev workspace, so neither the real client nor `runClient`
// notices -- but a plain JUnit JVM has neither, and any call from a pack jar into Minecraft
// dies there with NoSuchMethodError. That is why the ModularUI test dependency below goes
// through `rfg.deobf` and this one sentence is worth the space: an earlier version of this
// comment claimed no deobfuscation step was ever needed, and #125 cost an afternoon to it.
//
// Point `-Ppack_mods=<dir>` at any instance's `mods/` and all three resolve by glob. On a
// machine with the client instance that is the instance itself; on Tower it is the staged
// copy, because the AMP server's mods directory is mode 0700 uid 1000 and unreadable as
// 99:100 (stage it with a root container, see the skill). Individual `-P<name>_jar` flags
// override one entry without disturbing the others.
//
//   ./gradlew build -Ppack_mods=/coding/.recipegraph-build/deps
//
// GLOB, NOT A PINNED FILENAME, so a pack update that bumps ModularUI does not fail the
// build with a path that no longer exists. It is deliberately strict about ambiguity: two
// matches is an error, not a coin flip, because silently compiling against the older of two
// ModularUI jars is the kind of thing that surfaces as an inexplicable NoSuchMethodError at
// runtime rather than as a build failure.
def packJars = [
    hei_jar      : 'HadEnoughItems*.jar',
    modularui_jar: 'modularui-*.jar',
    ae2_jar      : 'ae2-uel-*.jar',
]

def resolvePackJar = { String prop, String pattern ->
    def explicit = project.findProperty(prop)
    if (explicit) {
        return file(explicit)
    }
    def dir = project.findProperty('pack_mods')
    if (!dir) {
        return null
    }
    def matches = file(dir).listFiles()?.findAll { it.name ==~ pattern.replace('*', '.*') }
    if (!matches) {
        return null
    }
    if (matches.size() > 1) {
        throw new GradleException(
            "pack_mods=${dir} has ${matches.size()} jars matching ${pattern}: " +
            "${matches*.name.sort()}. Remove one, or name the right one with -P${prop}=")
    }
    return matches[0]
}

def resolvedPackJars = packJars.collectEntries { prop, pattern ->
    [(prop): resolvePackJar(prop, pattern)]
}
def heiJar = resolvedPackJars.hei_jar
def modularuiJar = resolvedPackJars.modularui_jar

dependencies {
    if (heiJar && heiJar.exists()) {
        compileOnly files(heiJar)
        // Also at TEST runtime: DumpCommand references JEI types in its signatures, so
        // the class cannot even load without them, however little of it a test touches.
        testRuntimeOnly files(heiJar)
    }
    resolvedPackJars.each { prop, jar ->
        if (prop != 'hei_jar' && jar && jar.exists()) {
            compileOnly files(jar)
        }
    }
    if (modularuiJar && modularuiJar.exists()) {
        // ModularUI is on the TEST COMPILE classpath, not just at runtime, because the
        // layout pass is asserted headlessly (#125): `widget/sizer/Area` and
        // `widgets/layout/Column` reference no Minecraft and no GL symbols, and
        // `StandardResizer` touches only `net.minecraft.inventory.Slot`, which RFG already
        // puts on the test classpath. So widget trees can be built and resized in a plain
        // JUnit test with no window, which is the only fast feedback loop this GUI has.
        //
        // DO NOT drop the `rfg.deobf` back to a plain `files(...)`. It is the SRG-vs-MCP
        // problem described at the top of this file, and here is how it presents: a widget
        // that never touches Minecraft does not care, so `Column` lays out either way, but
        // `AbstractScrollWidget.beforeResize` asks the panel for its theme, the theme
        // registry builds `ResourceLocation`s, and that throws
        // `NoSuchMethodError: ResourceLocation.func_110623_a`. `WidgetTree.resizeInternal`
        // CATCHES EVERY THROWABLE and only logs it, so nothing fails -- the scroll subtree is
        // just silently left at zero size, and only an assertion notices.
        testImplementation rfg.deobf(files(modularuiJar))
    }
    // The NBT discriminator defines part of the dump schema (a digest that decides
    // whether two stacks are the same ingredient), and "it compiled" is not evidence
    // that it is stable or that it ignores what it claims to ignore. RFG puts the
    // patched Minecraft on the test classpath, so NBT can be exercised for real without
    // launching the game.
    testImplementation 'junit:junit:4.13.2'
    // `DigestFixtureTest` reads the shared digest contract at tests/fixtures/. Minecraft
    // 1.12.2 already ships gson 2.8.0 and pulls it onto the test classpath through the
    // patched-Minecraft dependency, so this is a pin rather than an addition: it names
    // the version the game uses, so the test cannot silently compile against a different
    // one if RFG's transitive graph changes.
    testImplementation 'com.google.code.gson:gson:2.8.0'
}

// Stamp a hash of the Java sources INTO the jar, so `tests/test_dist_jar.py` can tell a
// current dist jar from a stale one without a JDK.
//
// The hole this closes, demonstrated rather than imagined: that test compares the jar's
// SCHEMA int and a few capability markers against the source. A jar rebuilt three commits
// ago passes every one of those -- the schema deliberately does not move for most changes --
// so `dist/` could silently ship behaviour that no longer matches `mod/`, which is exactly
// the rot #81 exists to prevent, one level subtler.
//
// Sorted by relative path with String's natural ordering, which is UTF-16 code-unit order
// and locale-INDEPENDENT. Python's sorted() agrees on ASCII filenames. A locale-collated
// sort would make two byte-identical trees hash differently on different hosts and read as
// code drift; the skill records that trap.
def sourceHashFile = layout.buildDirectory.file('generated/sourceHash/mcrecipedump-source.sha256')
tasks.register('stampSourceHash') {
    def srcDir = file('src/main/java')
    inputs.dir srcDir
    outputs.file sourceHashFile
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        srcDir.traverse(type: groovy.io.FileType.FILES, nameFilter: ~/.*\.java/) { }
        def files = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                files << f
            }
        }
        files.sort { srcDir.toPath().relativize(it.toPath()).toString() }
        files.each { f ->
            // Path AND content: a renamed file with identical bytes is still a change.
            digest.update(srcDir.toPath().relativize(f.toPath()).toString()
                    .replace('\\', '/').getBytes('UTF-8'))
            digest.update(f.readBytes())
        }
        def out = sourceHashFile.get().asFile
        out.parentFile.mkdirs()
        out.text = digest.digest().encodeHex().toString() + '\n'
    }
}
processResources {
    from(sourceHashFile) { into '.' }
    dependsOn 'stampSourceHash'
}

test {
    testLogging { events 'passed', 'failed', 'skipped' }
    // THE SHARED FIXTURES ARE AN INPUT, and Gradle cannot work that out for itself: they
    // live outside `mod/`, so nothing in the default input set covers them and the test task
    // stays UP-TO-DATE across a fixture change. Observed while adding the plan fixtures --
    // dropping sixteen new files into `tests/fixtures/plan/` and re-running reported the
    // previous run's results, which is the worst possible answer: a gate that says PASS
    // without having looked. `DigestFixtureTest` reads `nbt_digest.json` from here too and
    // had the same hole.
    inputs.dir('../tests/fixtures').withPropertyName('sharedFixtures')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // AND THE ORACLE SWITCH, for the same reason one level up. `PlanFixtureTest`'s golden
    // gate is skipped unless RECIPEGRAPH_ORACLE names a graph, and an environment variable
    // is not an input Gradle can see -- so setting it after a run without it reported the
    // previous run's results, in 34 seconds, as a success. That is the same "PASS without
    // having looked" this file already guards against for the fixtures themselves, and it is
    // worse here because the whole point of setting the variable is to run the gate.
    inputs.property('recipegraphOracle',
            providers.environmentVariable('RECIPEGRAPH_ORACLE').orElse(''))
    // The oracle graph is 121 MB and the gate holds it plus a cost table; the default heap
    // is not enough and the failure is an OutOfMemoryError halfway through a fixture.
    maxHeapSize = '6g'
    // Forwarded so `NbtTraceTest`'s documented regeneration path actually works. A `-D` on
    // the gradlew command line reaches the GRADLE daemon's JVM, not the forked test JVM,
    // so without this the instruction in that test's javadoc is a lie that fails with
    // "the shared fixture is missing" and no way to produce it.
    if (System.getProperty('nbttrace.fixture')) {
        systemProperty 'nbttrace.fixture', System.getProperty('nbttrace.fixture')
    }
}

// Fail with an actionable message rather than 40 "package mezz.jei.api does not exist"
// errors, which is what a missing pack jar actually looks like.
//
// REPORT EVERY MISSING JAR AT ONCE, not the first. Failing one at a time turns a single
// misconfigured `pack_mods` into three separate build-fix-build cycles, each ~9 minutes
// cold, and the second failure looks like a new problem rather than the same one.
tasks.register('checkPackJars') {
    doFirst {
        def problems = []
        packJars.each { prop, pattern ->
            def jar = resolvedPackJars[prop]
            if (!jar) {
                problems << "  ${prop}: no ${pattern} found"
            } else if (!jar.exists()) {
                problems << "  ${prop}: does not exist: ${jar}"
            }
        }
        if (problems) {
            throw new GradleException(
                "Missing pack jars:\n${problems.join('\n')}\n" +
                'Point -Ppack_mods=<dir> at an instance mods/ directory holding all of ' +
                "${packJars.values().join(', ')}, or name one with -P<prop>=<path>.")
        }
    }
}
tasks.named('compileJava') { dependsOn 'checkPackJars' }

// Put the pack jars where a `runClient` dev session will actually load them. RFG reads mods
// from `run/mods/`, and the dev client is deliberately a SMALL mod set -- Forge, ModularUI,
// HEI and this mod -- rather than all 410, because the point is to render our own screens
// fast (#124), not to boot MeatballCraft.
//
// Jars staged for RUNTIME ONLY, nothing compiles against these:
//   MixinBooter    ModularUI is a Mixin coremod (`FMLCorePlugin` in its manifest, an early
//                  mixin config targeting GuiScreen/GuiContainer/FontRenderer) and bundles no
//                  Mixin of its own. Without MixinBooter its accessor mixins never apply and
//                  every ModularUI screen dies on a ClassCastException the moment it opens,
//                  which reads as a broken screen rather than as a missing loader. DO NOT
//                  drop it on the grounds that no ModularUI screen names it.
//   JEC            the reference implementation for the craftable-calculator shape (#19), so
//                  its GUI can be opened side by side with ours.
def devOnlyJars = [
    '*mixinbooter-*.jar',
    'JustEnoughCalculation-*.jar',
]
// SYNC, NOT COPY, so `run/mods` holds exactly this set and nothing else. A Copy never
// removes, so a pack update that renames a jar would leave both versions behind and the
// dev client would die on a duplicate modid -- reported as a Forge startup failure that
// says nothing about staging. A hand-dropped jar in `run/mods` does not survive this, on
// purpose: the dev mod set is defined here, not by whatever is lying in that directory.
tasks.register('stageDevMods', Sync) {
    dependsOn 'checkPackJars'
    def packModsDir = project.findProperty('pack_mods')
    from(resolvedPackJars.values().findAll { it != null })
    from(packModsDir ?: '.') {
        include devOnlyJars
    }
    into layout.projectDirectory.dir('run/mods')
    // A Sync whose pattern matched nothing reports nothing, and a dev client silently missing
    // MixinBooter fails much later and much less legibly. Same reasoning as `checkPackJars`:
    // name every absent jar at once, not the first.
    doLast {
        def staged = layout.projectDirectory.dir('run/mods').asFile.list() ?: new String[0]
        def missing = devOnlyJars.findAll { pattern ->
            !staged.any { it ==~ pattern.replace('*', '.*') }
        }
        if (missing) {
            throw new GradleException(
                "stageDevMods staged no ${missing.join(', ')} from pack_mods=${packModsDir}.\n" +
                'These are runtime-only, so the per-jar -P<name>_jar overrides do not supply ' +
                'them; point -Ppack_mods at a mods/ directory that has them. See the comment ' +
                'above this task for why the dev client cannot start without MixinBooter.')
        }
    }
}

// The headless screenshot harness drives the dev client through this task (#124). Everything
// below is inert without `-Dmcrecipedump.shot`, which only `harness/shot.sh` passes.
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'stageDevMods'

    // FORWARDED EXPLICITLY, because a `-D` on the gradlew command line reaches the GRADLE
    // JVM and not the forked client -- the same trap the `test` block above documents.
    System.properties.each { key, value ->
        if (key.toString().startsWith('mcrecipedump.')) {
            systemProperty(key.toString(), value.toString())
        }
    }

    // `cmdlineJvmArgs`, NOT `maxHeapSize` and not `extraJvmArgs`. RFG assembles the client's
    // JVM args in a doFirst as extraJvmArgs + the minecraft extension's + cmdlineJvmArgs, so
    // its own default -Xmx overwrites anything set the other two ways; cmdlineJvmArgs is last
    // and therefore wins. This matters on Tower, where the harness container is capped at 4g
    // and the household's Home Assistant is a sibling: a client left on RFG's default heap
    // can grow into the cap and take the container out.
    cmdlineJvmArgs.add('-Xmx' + (project.findProperty('client_heap') ?: '1536m'))

    // The client's window size, which is the PNG's size. Passed as game args because 1.12.2's
    // own Main parses --width/--height; there is no system property for it.
    def shotWidth = System.getProperty('mcrecipedump.shotWidth')
    def shotHeight = System.getProperty('mcrecipedump.shotHeight')
    if (shotWidth && shotHeight) {
        extraArgs.addAll('--width', shotWidth, '--height', shotHeight)
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.minecraft_version
    }
}


