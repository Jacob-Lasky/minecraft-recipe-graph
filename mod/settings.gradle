pluginManagement {
    repositories {
        maven {
            name 'GTNH Maven'   // RetroFuturaGradle lives here, not on Maven Central
            url 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets Gradle DOWNLOAD its own JDK 8 toolchain. This is what makes the build work
    // on a machine that only has a modern JDK installed: Gradle itself runs on Java 25,
    // while Minecraft 1.12.2 is compiled by a provisioned Java 8. No sudo, no system
    // JDK 8. DO NOT remove -- without it the build fails on any box lacking JDK 8.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mc-recipe-dump'
